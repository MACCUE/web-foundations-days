<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter and Dark Mode</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <button id="theme-toggle">Dark mode</button>

    <label for="note-text">Write your note:</label>
    <textarea id="note-text" placeholder="Start typing..."></textarea>

    <div class="stats">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <button id="clear-btn">Clear</button>
  </main>
</body>
</html>
